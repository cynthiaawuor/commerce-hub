services:
  service-vendor:
    image: postgres:18
    container_name: commerce_postgres
    environment:
      POSTGRES_DB: service-vendor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5434:5432'
    networks:
      - vendor_network

  # Procurement's private database, on its own network so no other service can reach it
  procurement-db:
    image: postgres:18
    container_name: procurement_postgres
    environment:
      POSTGRES_DB: service-procurement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5435:5432'
    networks:
      - procurement_network

  # Inventory's private database, on its own network so no other service can reach it
  inventory-db:
    image: postgres:18
    container_name: inventory_postgres
    environment:
      POSTGRES_DB: service-inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5436:5432'
    networks:
      - inventory_network

  # Receiving's private database, on its own network so no other service can reach it
  receiving-db:
    image: postgres:18
    container_name: receiving_postgres
    environment:
      POSTGRES_DB: service-receiving
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5437:5432'
    networks:
      - receiving_network

  # Warehouse Operations' private database, on its own network like the others
  warehouse-db:
    image: postgres:18
    container_name: warehouse_postgres
    environment:
      POSTGRES_DB: service-warehouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5438:5432'
    networks:
      - warehouse_network

  # Sales Audit's private database, on its own network like the others
  sales-audit-db:
    image: postgres:18
    container_name: sales_audit_postgres
    environment:
      POSTGRES_DB: service-sales-audit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5440:5432'
    networks:
      - sales_audit_network

  # Financials' private database, on its own network like the others
  financials-db:
    image: postgres:18
    container_name: financials_postgres
    environment:
      POSTGRES_DB: service-financials
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5441:5432'
    networks:
      - financials_network

  # Event bus. Every service publishes domain events here; subscribers read at their own
  # pace, and a durable queue holds messages while a subscriber is down.
  rabbitmq:
    image: rabbitmq:4-management
    container_name: commerce_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'
      # Management UI at http://localhost:15672 (guest/guest)
      - '15672:15672'
    healthcheck:
      # Run as the rabbitmq user
      test: ['CMD-SHELL', 'gosu rabbitmq rabbitmq-diagnostics -q ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - events_network

networks:
  vendor_network: {}
  procurement_network: {}
  warehouse_network: {}
  sales_audit_network: {}
  financials_network: {}
  events_network: {}
  inventory_network: {}
  receiving_network: {}
