# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

# Label each line of output with the task it came from, so the dev servers
# running side by side stay readable.
output: prefixed

vars:
  # Each service owns a private database, so there is one container per service
  POSTGRES_CONTAINERS: commerce_postgres procurement_postgres

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task --list
    silent: true

  dev:
    desc: Start both databases, the vendor API, the procurement API and the portal (watch mode)
    deps: [db:up]
    cmds:
      - task: dev:apps

  dev:apps:
    internal: true
    # deps run at the same time, so every server stays in the foreground until Ctrl+C
    deps: [dev:vendor, dev:procurement, dev:portal]

  dev:vendor:
    desc: Run service-vendor in watch mode (http://localhost:3000)
    dir: service-vendor
    prefix: vendor
    interactive: true
    cmds:
      - npm run dev

  dev:procurement:
    desc: Run service-procurement in watch mode (http://localhost:3001)
    dir: service-procurement
    prefix: procurement
    interactive: true
    cmds:
      - npm run dev

  dev:portal:
    desc: Run vendor-portal in watch mode (http://localhost:5173)
    dir: vendor-portal
    prefix: portal
    interactive: true
    cmds:
      - npm run dev

  db:up:
    desc: Start every Postgres container and wait until they accept connections
    prefix: db
    cmds:
      - docker compose up -d
      # compose reports a container as started before Postgres finishes booting,
      # so a service would fail its first query without this wait
      - |
        for container in {{.POSTGRES_CONTAINERS}}; do
          ready=false
          for i in $(seq 1 30); do
            if docker exec "$container" pg_isready -U postgres >/dev/null 2>&1; then
              echo "$container is ready"
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" = false ]; then
            echo "$container did not become ready in 30s" >&2
            exit 1
          fi
        done

  db:down:
    desc: Stop every Postgres container
    cmds:
      - docker compose down

  db:logs:
    desc: Follow the Postgres logs
    cmds:
      - docker compose logs -f
